name: MangaLens Cumulative OREZ Corpus + Stability Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mangalens-cumulative-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: orez-corpus-${{ github.run_id }}

jobs:
  build-nvidia-corpus:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build streamed NVIDIA corpus shards
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/stream_conversation_source.py
          mkdir -p dist/nvidia
          python orez-pack/stream_conversation_source.py \
            --source-id nvidia-nemotron-chat-if \
            --url 'https://huggingface.co/datasets/nvidia/Nemotron-Instruction-Following-Chat-v1/resolve/main/data/chat_if.jsonl?download=true' \
            --license ODC-BY-1.0 \
            --attribution 'NVIDIA Corporation; Nemotron-Instruction-Following-Chat-v1' \
            --output-dir dist/nvidia \
            --source-max-bytes 8589934592
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("dist/nvidia/source-manifest.json").read_text())
          assert m["generated_bytes"] >= 5*1024**3, m
          assert m["generated_bytes"] <= 8*1024**3, m
          assert m["record_count"] >= 100000
          print("NVIDIA corpus gate:", m["generated_bytes"], "bytes", m["record_count"], "records")
          PY
      - name: Create release container
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$(git rev-parse HEAD^)" \
            --title "OREZ conversation corpus ${{ github.run_id }}" \
            --notes "Validated OREZ conversation corpus for commit ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish NVIDIA shards
        run: gh release upload "$RELEASE_TAG" dist/nvidia/*.jsonl.gz dist/nvidia/source-manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-slimorca-corpus:
    if: github.event_name != 'pull_request'
    needs: build-nvidia-corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build streamed SlimOrca corpus shards
        run: |
          set -euo pipefail
          mkdir -p dist/slimorca
          python orez-pack/stream_conversation_source.py \
            --source-id openorca-slimorca \
            --url 'https://huggingface.co/datasets/Open-Orca/SlimOrca/resolve/main/oo-labeled_correct.gpt4.sharegpt.jsonl?download=true' \
            --license MIT \
            --attribution 'Open-Orca/SlimOrca contributors' \
            --output-dir dist/slimorca \
            --source-max-bytes 2147483648
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("dist/slimorca/source-manifest.json").read_text())
          assert m["generated_bytes"] > 500*1024**2, m
          print("SlimOrca corpus:", m["generated_bytes"], "bytes", m["record_count"], "records")
          PY
      - name: Publish SlimOrca shards
        run: gh release upload "$RELEASE_TAG" dist/slimorca/*.jsonl.gz dist/slimorca/source-manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-authored-seed:
    if: github.event_name != 'pull_request'
    needs: build-slimorca-corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize authored MangaLens seeds
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/build_conversation_pack.py
          python orez-pack/build_conversation_pack.py --allow-below-target
          gzip -9 -c dist/orez-conversation-master.jsonl > dist/orez-authored-seed.jsonl.gz
          sha256sum dist/orez-authored-seed.jsonl.gz > dist/orez-authored-seed.jsonl.gz.sha256
      - name: Publish authored seed
        run: gh release upload "$RELEASE_TAG" dist/orez-authored-seed.jsonl.gz dist/orez-authored-seed.jsonl.gz.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  validate-corpus-and-build-apk:
    if: github.event_name != 'pull_request'
    needs: publish-authored-seed
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download published corpus
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" --dir dist/release
          find dist/release -name '*.jsonl.gz' -print0 | xargs -0 -n1 gzip -t
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Strict 5-10 GiB corpus gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          root=Path("dist/release")
          total=records=0
          keys=set()
          email=re.compile(r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",re.I)
          phone=re.compile(r"(?<!\d)(?:\+?\d[\d .()\ -]{7,}\d)(?!\d)")
          for p in root.glob("*.jsonl.gz"):
              with gzip.open(p,"rt",encoding="utf-8") as f:
                  for line in f:
                      if not line.strip(): continue
                      total += len(line.encode("utf-8"))
                      records += 1
                      r=json.loads(line)
                      k=r.get("key")
                      assert k and k not in keys
                      keys.add(k)
                      assert r.get("prompt") and r.get("response")
                      assert not email.search(line) and not phone.search(line)
                      assert r.get("safety",{}).get("pii_checked") is True
                      assert r.get("safety",{}).get("sensitive_filtered") is True
          assert 5*1024**3 <= total <= 10*1024**3, total
          assert records >= 500000, records
          out={"format":"orez-conversation-jsonl-gzip-shards","generated_bytes":total,
               "record_count":records,"unique_keys":len(keys),"target_reached":True,
               "release_tag":"${{ env.RELEASE_TAG }}","source_commit":"${{ github.sha }}"}
          Path("dist/orez-corpus-final-manifest.json").write_text(json.dumps(out,indent=2))
          print("STRICT CORPUS GREEN:",total,"bytes;",records,"unique records")
          PY
      - name: Publish final corpus manifest
        run: gh release upload "$RELEASE_TAG" dist/orez-corpus-final-manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Validate project structure
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f orez-native/build.gradle.kts
          grep -q 'include(":orez-native")' settings.gradle.kts
          grep -q 'implementation(project(":orez-native"))' app/build.gradle.kts
      - name: Run unit tests
        run: gradle --no-daemon clean testDebugUnitTest --stacktrace
      - name: Run lint
        run: gradle --no-daemon lintDebug --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(wc -c < "$APK")" -gt 1000000
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Publish APK to corpus release
        run: gh release upload "$RELEASE_TAG" app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7

  pull-request-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace
