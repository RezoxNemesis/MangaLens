name: MangaLens Stability Validation and APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mangalens-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;29.0.13113456"             "cmake;3.31.6"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f orez-native/build.gradle.kts
          test -f orez-native/src/main/cpp/CMakeLists.txt
          grep -q 'include(":orez-native")' settings.gradle.kts
          grep -q 'implementation(project(":orez-native"))' app/build.gradle.kts

      - name: Validate OREZ conversation source policy
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path("orez-pack/conversation-sources.json").read_text(encoding="utf-8"))
          allowed = set(p["license_policy"])
          assert all(s.get("enabled", True) is False or s["license"] in allowed for s in p["sources"])
          print("OREZ conversation source policy validated.")

      - name: Restore Phase 1 conversation corpus
        uses: actions/download-artifact@v4
        with:
          name: orez-conversation-pack
          path: phase1-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36423358988

      - name: Phase 2 clean deduplicate and enrich conversations
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/process_phase2_conversations.py
          test -s phase1-artifact/dist/orez-conversation-master.jsonl
          python orez-pack/process_phase2_conversations.py
          test -s dist/phase2-conversation-master.jsonl
          test -s dist/phase2-clean-enrich-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dist/phase2-conversation-master.jsonl")
          m=json.loads(Path("dist/phase2-clean-enrich-manifest.json").read_text())
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert m["records"] == len(rows) and len(rows) >= 100000
          assert m["unique_keys"] == len({r["key"] for r in rows})
          assert m["bytes"] == p.stat().st_size
          assert all(r["type"]=="conversation" and r["prompt"] and r["response"] for r in rows)
          assert all(r["safety"]["pii_checked"] and r["safety"]["sensitive_filtered"] for r in rows)
          print("Phase 2 validated:", m["records"], "records,", m["bytes"], "bytes")
          PY

      - name: Upload Phase 2 conversation master
        uses: actions/upload-artifact@v4
        with:
          name: orez-phase2-conversation-master
          if-no-files-found: error
          path: |
            dist/phase2-conversation-master.jsonl
            dist/phase2-clean-enrich-manifest.json

      - name: Build and validate OREZ conversation pack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/build_conversation_pack.py
          python orez-pack/build_conversation_pack.py --allow-below-target
          test -s dist/orez-conversation-master.jsonl
          test -s dist/orez-conversation-master.jsonl.sha256
          test -s dist/conversation-pack-manifest.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          seeds = [
              Path("orez-pack/seed/conversations_mangalens_seed.jsonl"),
              Path("orez-pack/seed/conversations_hinglish_priority.jsonl"),
              Path("orez-pack/seed/conversations_mangalens_core_hinglish.jsonl"),
          ]
          counts = []
          for p in seeds:
              count = 0
              for line in p.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  x = json.loads(line)
                  assert x["type"] == "conversation"
                  assert x["prompt"] and x["response"]
                  assert x["language"] in {"en", "hi-Latn"}
                  assert x["license"] == "MIT"
                  assert x["safety"]["pii_checked"] is True
                  assert x["safety"]["sensitive_filtered"] is True
                  count += 1
              counts.append(count)
          assert counts[0] >= 40 and counts[1] >= 20 and counts[2] >= 100
          manifest = json.loads(Path("dist/conversation-pack-manifest.json").read_text(encoding="utf-8"))
          data = Path("dist/orez-conversation-master.jsonl").read_bytes()
          assert manifest["sha256"] == hashlib.sha256(data).hexdigest()
          generated = [json.loads(line) for line in data.decode("utf-8").splitlines() if line.strip()]
          assert len(generated) == manifest["record_count"]
          assert manifest["record_count"] >= 100
          assert len({r["key"] for r in generated}) == manifest["record_count"]
          assert all(r["type"] == "conversation" and r["prompt"] and r["response"] for r in generated)
          assert manifest["target_size_bytes"]["max"] == 10 * 1024**3
          print("Validated OREZ conversation pack:", counts, "unique records=", manifest["record_count"], "bytes=", manifest["generated_bytes"])
          PY

      - name: Upload OREZ conversation pack
        uses: actions/upload-artifact@v4
        with:
          name: orez-conversation-pack
          if-no-files-found: error
          path: |
            dist/orez-conversation-master.jsonl
            dist/orez-conversation-master.jsonl.sha256
            dist/conversation-pack-manifest.json

      - name: Run unit tests
        run: gradle --no-daemon clean testDebugUnitTest --stacktrace

      - name: Run Android lint stability checks
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          test "$(wc -c < "$APK")" -gt 1000000

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

