name: MangaLens Cumulative OREZ Corpus + Stability Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "engineering/mangalens-production", "engineering/mangalens-2.2-runtime-recovery"]
  workflow_dispatch:

concurrency:
  group: mangalens-cumulative-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  MANGALENS_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_TAG: orez-corpus-${{ github.run_id }}

jobs:
  build-nvidia-corpus:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build streamed NVIDIA corpus shards
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/stream_conversation_source.py
          mkdir -p dist/nvidia
          python orez-pack/stream_conversation_source.py \
            --source-id nvidia-nemotron-chat-if \
            --url 'https://huggingface.co/datasets/nvidia/Nemotron-Instruction-Following-Chat-v1/resolve/main/data/chat_if.jsonl?download=true' \
            --license ODC-BY-1.0 \
            --attribution 'NVIDIA Corporation; Nemotron-Instruction-Following-Chat-v1' \
            --output-dir dist/nvidia \
            --source-max-bytes 8589934592
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("dist/nvidia/source-manifest.json").read_text())
          assert m["generated_bytes"] >= 2*1024**3, m
          assert m["generated_bytes"] <= 8*1024**3, m
          assert m["record_count"] >= 100000
          print("NVIDIA corpus gate:", m["generated_bytes"], "bytes", m["record_count"], "records")
          PY
      - name: Upload NVIDIA corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: orez-nvidia-corpus
          path: |
            dist/nvidia/*.jsonl.gz
            dist/nvidia/nvidia-source-manifest.json
          retention-days: 7

  build-slimorca-corpus:
    if: github.event_name == 'workflow_dispatch'
    needs: build-nvidia-corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build streamed SlimOrca corpus shards
        run: |
          set -euo pipefail
          mkdir -p dist/slimorca
          python orez-pack/stream_conversation_source.py \
            --source-id openorca-slimorca \
            --url 'https://huggingface.co/datasets/Open-Orca/SlimOrca/resolve/main/oo-labeled_correct.gpt4.sharegpt.jsonl?download=true' \
            --license MIT \
            --attribution 'Open-Orca/SlimOrca contributors' \
            --output-dir dist/slimorca \
            --source-max-bytes 2147483648
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("dist/slimorca/source-manifest.json").read_text())
          assert m["generated_bytes"] > 500*1024**2, m
          print("SlimOrca corpus:", m["generated_bytes"], "bytes", m["record_count"], "records")
          Path("dist/slimorca/slimorca-source-manifest.json").write_text(Path("dist/slimorca/source-manifest.json").read_text())
          PY
      - name: Upload SlimOrca corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: orez-slimorca-corpus
          path: |
            dist/slimorca/*.jsonl.gz
            dist/slimorca/slimorca-source-manifest.json
          retention-days: 7

  build-openorca-corpus:
    if: github.event_name == 'workflow_dispatch'
    needs: build-nvidia-corpus
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build streamed OpenOrca corpus shards
        run: |
          set -euo pipefail
          mkdir -p dist/openorca
          python -m py_compile orez-pack/stream_conversation_source.py
          python orez-pack/stream_conversation_source.py \
            --source-id openorca-gpt4-augmented \
            --url 'https://huggingface.co/datasets/Open-Orca/OpenOrca/resolve/e7a4fef269befda90e7018f480465068f13938c4/001-1M-GPT4-Augmented/1M-GPT4-Augmented-train.jsonl?download=true' \
            --license MIT \
            --attribution 'Open-Orca contributors; OpenOrca dataset' \
            --output-dir dist/openorca \
            --source-max-bytes 2147483648
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dist/openorca/source-manifest.json').read_text())
          assert m['generated_bytes'] >= 1*1024**3, m
          assert m['generated_bytes'] <= 2*1024**3, m
          assert m['record_count'] >= 100000, m
          print('OpenOrca corpus:', m['generated_bytes'], 'bytes', m['record_count'], 'records')
          Path('dist/openorca/openorca-source-manifest.json').write_text(Path('dist/openorca/source-manifest.json').read_text())
          PY
      - name: Upload OpenOrca corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: orez-openorca-corpus
          path: |
            dist/openorca/*.jsonl.gz
            dist/openorca/openorca-source-manifest.json
          retention-days: 7
  publish-authored-seed:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-slimorca-corpus, build-openorca-corpus]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize authored MangaLens seeds
        run: |
          set -euo pipefail
          python -m py_compile orez-pack/build_conversation_pack.py
          python orez-pack/build_conversation_pack.py --allow-below-target
          gzip -9 -c dist/orez-conversation-master.jsonl > dist/orez-authored-seed.jsonl.gz
          sha256sum dist/orez-authored-seed.jsonl.gz > dist/orez-authored-seed.jsonl.gz.sha256
      - name: Upload authored seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: orez-authored-seed
          path: |
            dist/orez-authored-seed.jsonl.gz
            dist/orez-authored-seed.jsonl.gz.sha256
          retention-days: 7

  validate-corpus-and-build-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-authored-seed
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download published corpus artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orez-*
          path: dist/release
          merge-multiple: true
      - name: Verify downloaded corpus shards
        run: |
          set -euo pipefail
          find dist/release -name '*.jsonl.gz' -print0 | xargs -0 -n1 gzip -t
      - name: Strict 5-10 GiB corpus gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          root=Path("dist/release")
          total=records=0
          keys=set()
          email=re.compile(r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",re.I)
          phone=re.compile(r"(?<!\d)(?:\+?\d[\d .()\ -]{7,}\d)(?!\d)")
          for p in root.glob("*.jsonl.gz"):
              with gzip.open(p,"rt",encoding="utf-8") as f:
                  for line in f:
                      if not line.strip(): continue
                      total += len(line.encode("utf-8"))
                      records += 1
                      r=json.loads(line)
                      k=r.get("key")
                      assert k and k not in keys
                      keys.add(k)
                      assert r.get("prompt") and r.get("response")
                      text_content = "\n".join([str(r.get("prompt","")), str(r.get("response",""))] + [str(t.get("text","")) for t in r.get("turns",[]) if isinstance(t,dict)])
                      assert not email.search(text_content), f"PII email detected in {p.name} record {k}"
                      assert not phone.search(text_content), f"PII phone detected in {p.name} record {k}"
                      assert r.get("safety",{}).get("pii_checked") is True
                      assert r.get("safety",{}).get("sensitive_filtered") is True
          assert 5*1024**3 <= total <= 10*1024**3, total
          assert records >= 500000, records
          out={"format":"orez-conversation-jsonl-gzip-shards","generated_bytes":total,
               "record_count":records,"unique_keys":len(keys),"target_reached":True,
               "release_tag":"${{ env.RELEASE_TAG }}","source_commit":"${{ github.sha }}"}
          Path("dist/orez-corpus-final-manifest.json").write_text(json.dumps(out,indent=2))
          print("STRICT CORPUS GREEN:",total,"bytes;",records,"unique records")
          PY
      - name: Upload final corpus manifest
        uses: actions/upload-artifact@v4
        with:
          name: orez-final-corpus-manifest
          path: dist/orez-corpus-final-manifest.json
          retention-days: 7
      - name: Free runner disk before Android toolchain and emulator installation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Confirm Java runtime
        run: |
          set -euo pipefail
          java -version
          test "$(java -version 2>&1 | sed -n 's/.*version "\([0-9]*\).*/\1/p' | head -n1)" = "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Validate project structure
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f orez-native/build.gradle.kts
          grep -q 'include(":orez-native")' settings.gradle.kts
          grep -q 'implementation(project(":orez-native"))' app/build.gradle.kts
      - name: Generate controlled media fixtures
        run: bash .github/scripts/create-video-ocr-fixture.sh
      - name: Run unit tests
        run: gradle --no-daemon clean testDebugUnitTest --stacktrace
      - name: Run lint
        run: gradle --no-daemon lintDebug --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/debug
          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -name 'app-*-debug.apk' -type f | wc -l)"
          test "$APK_COUNT" -eq 2
          for ABI_APK in "$APK_DIR"/app-*-debug.apk; do
            test -s "$ABI_APK"
            test "$(wc -c < "$ABI_APK")" -gt 1000000
            sha256sum "$ABI_APK" | tee "$ABI_APK.sha256"
          done
          python .github/scripts/verify-debug-apks.py
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-debug-apk
          path: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/app-*-debug.apk.sha256
          retention-days: 7

  build-and-validate-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Confirm runner allocation and workflow context
        run: |
          set -euo pipefail
          echo "Runner acquired: $(uname -a)"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Commit: ${GITHUB_SHA}"
      - uses: actions/checkout@v4
      - name: Free runner disk before Android toolchain and emulator installation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Confirm Java runtime
        run: |
          set -euo pipefail
          java -version
          test "$(java -version 2>&1 | sed -n 's/.*version "\([0-9]*\).*/\1/p' | head -n1)" = "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Validate project structure
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f orez-native/build.gradle.kts
          grep -q 'include(":orez-native")' settings.gradle.kts
          grep -q 'implementation(project(":orez-native"))' app/build.gradle.kts
      - name: Generate controlled media fixtures
        run: bash .github/scripts/create-video-ocr-fixture.sh
      - name: Run unit tests
        run: gradle --no-daemon clean testDebugUnitTest --stacktrace
      - name: Run lint
        run: gradle --no-daemon lintDebug --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/debug
          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -name 'app-*-debug.apk' -type f | wc -l)"
          test "$APK_COUNT" -eq 2
          for ABI_APK in "$APK_DIR"/app-*-debug.apk; do
            test -s "$ABI_APK"
            test "$(wc -c < "$ABI_APK")" -gt 1000000
            sha256sum "$ABI_APK" | tee "$ABI_APK.sha256"
          done
          python .github/scripts/verify-debug-apks.py
      - name: Detect Android emulator acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "MANGALENS_EMULATOR_ACCELERATION=kvm" >> "$GITHUB_ENV"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "MANGALENS_EMULATOR_ACCELERATION=software" >> "$GITHUB_ENV"
              echo "::warning::KVM is not usable; falling back to software emulation."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MANGALENS_EMULATOR_ACCELERATION=software" >> "$GITHUB_ENV"
            echo "::warning::No /dev/kvm on this runner; falling back to software emulation."
          fi
      - name: Run full acceptance in target-SDK Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disk-size: 4096M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: ${{ steps.emulator_accel.outputs.available != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/android/run-acceptance.sh --suite full --require-model --evidence-dir app/build/diagnostics/api-35
      - name: Upload MangaLens startup diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-startup-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload downloadable APK artifact
        if: always()
        id: upload_main_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-debug-apk
          path: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/app-*-debug.apk.sha256
          retention-days: 7
      - name: Publish main APK release if artifact storage is unavailable
        if: success() && steps.upload_main_apk.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mangalens-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MangaLens APK build ${{ github.run_number }}
          body: |
            Automated MangaLens debug APKs built and launch-smoke-tested from commit ${{ github.sha }}.
            GitHub Actions artifact storage was unavailable, so these files are published as a prerelease fallback.
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/app-*-debug.apk.sha256

  pull-request-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify exact pull request source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$MANGALENS_GIT_SHA"
      - name: Validate device acceptance failure detection
        run: python3 -m unittest discover -s scripts/android -p 'test_*.py'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Free runner disk before Android toolchain and emulator installation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Accept Android SDK licenses and install native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Build, test, lint, and assemble debug APK
        run: |
          bash .github/scripts/create-video-ocr-fixture.sh
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/debug
          APK_COUNT="$(find "$APK_DIR" -maxdepth 1 -name 'app-*-debug.apk' -type f | wc -l)"
          test "$APK_COUNT" -eq 2
          for ABI_APK in "$APK_DIR"/app-*-debug.apk; do
            test -s "$ABI_APK"
            test "$(wc -c < "$ABI_APK")" -gt 1000000
            sha256sum "$ABI_APK" | tee "$ABI_APK.sha256"
          done
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk.sha256
          python .github/scripts/verify-debug-apks.py
      - name: Detect Android emulator acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "MANGALENS_EMULATOR_ACCELERATION=kvm" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MANGALENS_EMULATOR_ACCELERATION=software" >> "$GITHUB_ENV"
            echo "::warning::KVM is unavailable; attempting bounded software emulation."
          fi
      - name: Run full acceptance in target-SDK Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disk-size: 4096M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: ${{ steps.emulator_accel.outputs.available != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android/run-acceptance.sh --suite full --require-model --evidence-dir app/build/diagnostics/api-35
      - name: Upload PR device acceptance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-pr-startup-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload pull-request debug APK
        if: success()
        id: upload_pr_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-pr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/app-*-debug.apk.sha256
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk.sha256
          retention-days: 7
      - name: Publish APK release if artifact storage is unavailable
        if: success() && steps.upload_pr_apk.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mangalens-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          target_commitish: ${{ env.MANGALENS_GIT_SHA }}
          name: MangaLens PR #${{ github.event.pull_request.number }} APK build ${{ github.run_number }}
          body: |
            Fallback APK for testing because GitHub Actions artifact upload failed.
            Built and emulator-tested from pull request head ${{ env.MANGALENS_GIT_SHA }}.
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-*-debug.apk
            app/build/outputs/apk/debug/app-*-debug.apk.sha256

  pull-request-compatibility:
    if: github.event_name == 'pull_request'
    needs: pull-request-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify exact pull request source
        run: test "$(git rev-parse HEAD)" = "$MANGALENS_GIT_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare APK inspection tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
      - name: Download the primary gate's verified APKs
        uses: actions/download-artifact@v4
        with:
          name: mangalens-pr-debug-apk
          path: candidate-apks
      - name: Resolve and recheck candidate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APP_APK="$(find candidate-apks -type f -name app-x86_64-debug.apk)"
          TEST_APK="$(find candidate-apks -type f -name app-debug-androidTest.apk)"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          EXPECTED_HASH="$(cut -d ' ' -f 1 "$APP_APK.sha256")"
          test "$EXPECTED_HASH" = "$(sha256sum "$APP_APK" | cut -d ' ' -f 1)"
          EXPECTED_TEST_HASH="$(cut -d ' ' -f 1 "$TEST_APK.sha256")"
          test "$EXPECTED_TEST_HASH" = "$(sha256sum "$TEST_APK" | cut -d ' ' -f 1)"
          echo "MANGALENS_ACCEPTANCE_APP_APK=$APP_APK" >> "$GITHUB_ENV"
          echo "MANGALENS_ACCEPTANCE_TEST_APK=$TEST_APK" >> "$GITHUB_ENV"
      - name: Detect Android emulator acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "MANGALENS_EMULATOR_ACCELERATION=kvm" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MANGALENS_EMULATOR_ACCELERATION=software" >> "$GITHUB_ENV"
            echo "::warning::KVM is unavailable; attempting bounded software emulation."
          fi
      - name: Run retained-screen compatibility on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disk-size: 4096M
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: ${{ steps.emulator_accel.outputs.available != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/android/run-acceptance.sh --suite core --timeout 900 \
              --app-apk "$MANGALENS_ACCEPTANCE_APP_APK" --test-apk "$MANGALENS_ACCEPTANCE_TEST_APK" \
              --evidence-dir app/build/diagnostics/api-28
      - name: Upload older-API acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangalens-pr-api-28-evidence
          path: app/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
